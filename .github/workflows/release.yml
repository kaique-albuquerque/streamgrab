# P10 — Release (seção 30 do architect.md)
# Disparo manual/explícito: empurrar uma tag v* cria os instaladores Windows/macOS/Linux,
# checksums e uma GitHub Release. Nunca automático sem tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build instalador MSI
        run: npm run dist

      - name: Publicar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.msi
            dist/*.blockmap
            dist/*.yml

  build-macos-x64:
    name: Build installer (macOS Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar FFmpeg
        run: brew install ffmpeg

      - name: Instalar dependências
        run: npm ci

      - name: Build instalador PKG x64
        run: npm run pack:resources && npx electron-builder --mac --x64

      - name: Publicar artefatos macOS x64
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: |
            dist/*.pkg
            dist/*.blockmap
            dist/*.yml

  build-macos-arm64:
    name: Build installer (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar FFmpeg
        run: brew install ffmpeg

      - name: Instalar dependências
        run: npm ci

      - name: Build instalador PKG arm64
        run: npm run pack:resources && npx electron-builder --mac --arm64

      - name: Publicar artefatos macOS arm64
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dist/*.pkg
            dist/*.blockmap
            dist/*.yml

  build-linux:
    name: Build installers (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: npm ci

      - name: Build instaladores Linux
        run: npm run dist:linux

      - name: Publicar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-x64, build-macos-arm64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar artefatos da release
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums SHA-256
        run: node scripts/checksums.mjs

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.pkg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            dist/SHA256SUMS.txt
          generate_release_notes: true
