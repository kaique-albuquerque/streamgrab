<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- P8 (seção 24): CSP restritiva — só recursos locais; imagens https
         (thumbnails de providers) e data: são permitidas para a UI.
         media-src: preview local gravado em temp (file:) — SPEC-06. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' file: blob:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>StreamGrab</title>
    <link rel="stylesheet" href="./styles-base.css" />
    <link rel="stylesheet" href="./styles-layout.css" />
    <link rel="stylesheet" href="./styles-forms.css" />
    <link rel="stylesheet" href="./styles-download.css" />
    <link rel="stylesheet" href="./styles-media.css" />
    <link rel="stylesheet" href="./styles-queue.css" />
    <link rel="stylesheet" href="./styles-responsive.css" />
    <link rel="stylesheet" href="./styles-tutorial.css" />
    <link rel="stylesheet" href="./styles-help.css" />
    <link rel="stylesheet" href="./styles-dashboard.css" />
    <link rel="stylesheet" href="./styles-batch.css" />
    <link rel="stylesheet" href="./styles-history.css" />
    <link rel="stylesheet" href="./styles-preview.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="ascii-box">
            <pre>==============================================
   StreamGrab - HLS / DASH / YouTube /
   Redes sociais via FFmpeg + curl-impersonate
==============================================</pre>
          </div>
          <p class="subtitle">Interface espelhando o fluxo do CLI, com as mesmas etapas e mensagens principais.</p>
        </div>
        <div class="topbar-actions">
          <nav class="view-nav">
            <button id="viewVideosBtn" class="button button-ghost view-btn active" type="button">Vídeos</button>
            <button id="viewQueueBtn" class="button button-ghost view-btn" type="button">
              Fila <span id="queueBadge" class="badge" hidden>0</span>
            </button>
            <button id="viewHistoryBtn" class="button button-ghost view-btn" type="button">Histórico</button>
            <button id="viewSettingsBtn" class="button button-ghost view-btn" type="button">Configurações</button>
          </nav>
          <label class="theme-toggle" for="themeToggle">
            <input id="themeToggle" type="checkbox" />
            <span data-theme-label>Modo escuro</span>
          </label>
          <button id="batchBtn" class="button button-ghost">📦 Download em lote</button>
          <button id="newTabBtn" class="button button-ghost">+ Nova aba</button>
        </div>
      </header>

      <div id="view-videos" class="view active">
        <nav id="tabBar" class="tabbar"></nav>
        <main id="tabPanels" class="panels"></main>
      </div>

      <!-- Views e templates carregados dinamicamente de templates/*.html -->
      <div id="dynamicViews"></div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
