    <template id="tabTemplate">
      <section class="panel">
        <aside class="sidebar card">
          <div class="section-heading">Fluxo do CLI</div>
          <ol class="steps">
            <li data-step="ffmpeg" class="step active">
              <span class="step-index">1</span>
              <div>
                <strong>Verificando FFmpeg...</strong>
                <small>Confere dependências antes de iniciar.</small>
              </div>
            </li>
            <li data-step="url" class="step">
              <span class="step-index">2</span>
              <div>
                <strong>URL do vídeo ou playlist</strong>
                <small>Valida HLS, DASH, YouTube ou redes sociais e tenta analisar o conteúdo.</small>
              </div>
            </li>
            <li data-step="variant" class="step">
              <span class="step-index">3</span>
              <div>
                <strong>Qualidades encontradas</strong>
                <small>Escolha manual ou melhor disponível.</small>
              </div>
            </li>
            <li data-step="file" class="step">
              <span class="step-index">4</span>
              <div>
                <strong>Nome do arquivo</strong>
                <small>Saída final em `.mp4`.</small>
              </div>
            </li>
            <li data-step="dir" class="step">
              <span class="step-index">5</span>
              <div>
                <strong>Pasta de saída</strong>
                <small>Usa Downloads por padrão.</small>
              </div>
            </li>
            <li data-step="download" class="step">
              <span class="step-index">6</span>
              <div>
                <strong>Baixando</strong>
                <small>Fallback automático entre os modos do FFmpeg.</small>
              </div>
            </li>
          </ol>

          <div class="meta-card">
            <div class="meta-label">Modo atual</div>
            <div data-field="modeLabel" class="meta-value">Aguardando análise</div>
          </div>

          <div class="meta-card">
            <div class="meta-label">Saída</div>
            <div data-field="resolvedOutput" class="meta-value mono">Ainda não definida</div>
          </div>
        </aside>

        <div class="content">
          <section class="card form-card">
            <div class="section-heading">Entradas</div>
            <div class="prompt-list">
              <label class="prompt">
                <span class="prompt-title">URL do vídeo/playlist:</span>
                <input data-field="url" placeholder="Cole a URL aqui" />
              </label>

              <div class="grid2">
                <label class="prompt">
                  <span class="prompt-title">Nome do arquivo (sem extensão):</span>
                  <input data-field="filename" placeholder="video" />
                </label>

                <label class="prompt">
                  <span class="prompt-title">Pasta de saída (Enter = Downloads):</span>
                  <div class="inline-row">
                    <input data-field="outputDir" placeholder="Downloads" />
                    <button data-action="pickDir" class="button button-ghost" type="button">Escolher</button>
                  </div>
                </label>
              </div>

              <label class="toggle">
                <input data-field="turbo" type="checkbox" />
                <span>⚡ Turbo — download paralelo por partes (mais rápido em YouTube/sociais/arquivos diretos)</span>
              </label>

              <div class="action-row">
                <button data-action="analyze" class="button button-primary" type="button">Analisar playlist</button>
                <button data-action="preview" class="button button-ghost" type="button" disabled>▶ Pré-visualizar</button>
                <button data-action="download" class="button button-accent" type="button">Baixar agora</button>
                <button data-action="enqueue" class="button button-ghost" type="button">Adicionar à fila</button>
                <button data-action="cancel" class="button button-ghost" type="button">Cancelar</button>
              </div>
            </div>
          </section>

          <section class="card qualities-card">
            <div class="section-heading">Qualidades encontradas</div>
            <div class="hint-line">Mesmo comportamento do CLI: se você não escolher nada, usamos a melhor disponível.</div>
            <div data-field="qualities" class="qualities empty">Nenhuma URL analisada ainda.</div>
          </section>

          <section class="card metadata-card" data-field="metadata" hidden>
            <div class="section-heading">Informações do vídeo</div>
            <div class="media-meta">
              <img data-field="thumbnail" class="thumb" alt="" hidden />
              <div class="meta-grid">
                <div class="meta-item">
                  <span class="meta-label">Título</span>
                  <strong data-field="metaTitle" class="meta-value">—</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Duração</span>
                  <strong data-field="metaDuration" class="meta-value">—</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Provider / Protocolo</span>
                  <strong data-field="metaProvider" class="meta-value">—</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Resolução / Codec</span>
                  <strong data-field="metaCodec" class="meta-value">—</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Bitrate</span>
                  <strong data-field="metaBitrate" class="meta-value">—</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Tamanho estimado</span>
                  <strong data-field="metaSize" class="meta-value">—</strong>
                </div>
              </div>
            </div>
          </section>

          <section class="card audio-subtitle-card" data-field="audioSubtitleSection" hidden>
            <div class="section-heading">🎵 Áudio e Legendas</div>
            <div class="audio-subtitle-content">
              <div data-field="audioTracksContainer" class="audio-tracks" hidden>
                <label class="meta-label">Faixa de áudio:</label>
                <select data-field="audioTrackSelect" class="select-field"></select>
                <label class="checkbox-inline">
                  <input data-field="allAudio" type="checkbox" />
                  <span>Baixar todas as faixas de áudio</span>
                </label>
              </div>
              <div data-field="subtitleTracksContainer" class="subtitle-tracks" hidden>
                <label class="meta-label">Legendas:</label>
                <div data-field="subtitleCheckboxes" class="subtitle-checkboxes"></div>
                <label class="checkbox-inline">
                  <input data-field="embedSubs" type="checkbox" />
                  <span>Embutir no vídeo</span>
                </label>
              </div>
              <div data-field="noTracksMessage" class="hint-line" hidden>
                Nenhuma faixa de áudio ou legenda adicional disponível para esta fonte.
              </div>
            </div>
          </section>

          <section class="card progress-card">
            <div class="console-toolbar">
              <div>
                <div class="section-heading">Saída do processo</div>
                <div data-field="status" class="status">Pronto.</div>
              </div>
              <div data-field="percent" class="percent">0%</div>
            </div>

            <div class="stats">
              <div class="stat">
                <span>Tempo</span>
                <strong data-field="timeValue">--:--:--</strong>
              </div>
              <div class="stat">
                <span>Tamanho</span>
                <strong data-field="sizeValue">0 B</strong>
              </div>
              <div class="stat">
                <span>Velocidade</span>
                <strong data-field="speedValue">N/A</strong>
              </div>
            </div>

            <div class="progress-shell">
              <div data-field="progressBar" class="progress-bar"></div>
            </div>

            <pre data-field="log" class="log"></pre>

            <div class="reveal-row" data-field="revealRow" hidden>
              <button data-action="openFile" class="button button-ghost" type="button">Abrir arquivo</button>
              <button data-action="showInFolder" class="button button-ghost" type="button">Mostrar na pasta</button>
            </div>
          </section>
        </div>
      </section>
    </template>
