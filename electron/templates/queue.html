      <section id="view-queue" class="view" hidden>
        <div class="view-header card">
          <div>
            <h2>Fila de downloads</h2>
            <p class="hint-line" id="queueSummary">Carregando fila...</p>
          </div>
          <div class="view-actions">
            <button id="queueTogglePauseBtn" class="button button-ghost" type="button">Pausar fila</button>
            <button id="queueRefreshBtn" class="button button-ghost" type="button">Atualizar</button>
          </div>
        </div>
        <div id="queueDashboard" class="queue-dashboard"></div>
        <div id="queueList" class="queue-list"></div>
        <div id="queueEmpty" class="empty-state" hidden>Nenhum download na fila.</div>
      </section>
